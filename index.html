<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppMall | Minimalist Web Apps</title>
    <style>
        :root {
            --bg: #f8fafc;
            --text: #0f172a;
            --primary: #7a4bff; /* AppMall Orijinal Moru */
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
        }
        .logo-container {
            display: flex;
            align-items: center;
        }
        .logo-img {
            height: 38px; /* Navbar için ideal yükseklik */
            width: auto;
            display: block;
        }
        .right-nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .nav-menu {
            display: flex;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .nav-menu a {
            text-decoration: none;
            color: #475569;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .nav-menu a:hover {
            color: var(--primary);
        }
        .lang-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            background: #f1f5f9;
        }
        header {
            text-align: center;
            margin: 20px 0 40px 0;
            max-width: 700px;
        }
        header p {
            font-size: 1.2rem;
            color: #475569;
            line-height: 1.6;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }
        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
            border: 1px solid var(--border);
        }
        .card:hover { 
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgb(122 75 255 / 0.1);
        }
        .badge {
            background: #f3e8ff;
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        h2 {
            font-size: 1.5rem;
            margin: 15px 0 10px 0;
        }
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            .right-nav {
                flex-direction: column;
                gap: 15px;
            }
            .nav-menu {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-container">
            <!-- Aynı dizindeki logo.png dosyasını çeker -->
            <img src="logo.png" alt="AppMall Logo" class="logo-img">
        </div>
        <div class="right-nav">
            <ul class="nav-menu">
                <li><a href="#" id="menuHome">Ana Sayfa</a></li>
                <li><a href="#applications" id="menuApps">Uygulamalar</a></li>
                <li><a href="#" id="menuAbout">Hakkımızda</a></li>
                <li><a href="mailto:support@appmall.io" id="menuSupport">Destek</a></li>
            </ul>
            <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
        </div>
    </nav>

    <header>
        <p id="mainDesc">Sade, hızlı ve hayatı kolaylaştıran mobil öncelikli uygulamalar çatısı.</p>
    </header>

    <main class="grid" id="applications">
        <!-- Give Up Smoking -->
        <a href="apps/give-up-smoking.html" class="card">
            <span class="badge" id="appBadge">Sağlık & Yaşam</span>
            <h2 id="appTitle">Give Up Smoking</h2>
            <p id="appDesc">Sigarayı bırakma sürecinizi takip edin, sağlığınızı ve bütçenizi geri kazanın.</p>
        </a>
    </main>

    <script>
        const translations = {
            tr: {
                btn: "EN",
                menuHome: "Ana Sayfa",
                menuApps: "Uygulamalar",
                menuAbout: "Hakkımızda",
                menuSupport: "Destek",
                desc: "Sade, hızlı ve hayatı kolaylaştıran mobil öncelikli uygulamalar çatısı.",
                badge: "Sağlık & Yaşam",
                appDesc: "Sigarayı bırakma sürecinizi takip edin, sağlığınızı ve bütçenizi geri kazanın."
            },
            en: {
                btn: "TR",
                menuHome: "Home",
                menuApps: "Applications",
                menuAbout: "About Us",
                menuSupport: "Support",
                desc: "Simple, fast, and mobile-first web applications hub.",
                badge: "Health & Life",
                appDesc: "Track your smoking cessation process, regain your health and budget."
            }
        };

        let currentLang = 'tr';

        function toggleLanguage() {
            currentLang = currentLang === 'tr' ? 'en' : 'tr';
            
            document.getElementById('langBtn').innerText = translations[currentLang].btn;
            document.getElementById('menuHome').innerText = translations[currentLang].menuHome;
            document.getElementById('menuApps').innerText = translations[currentLang].menuApps;
            document.getElementById('menuAbout').innerText = translations[currentLang].menuAbout;
            document.getElementById('menuSupport').innerText = translations[currentLang].menuSupport;
            document.getElementById('mainDesc').innerText = translations[currentLang].desc;
            document.getElementById('appBadge').innerText = translations[currentLang].badge;
            document.getElementById('appDesc').innerText = translations[currentLang].appDesc;
            
            document.documentElement.lang = currentLang;
        }
    </script>
</body>
</html>
