<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppMall | Premium Mobil & Web Uygulamaları Stüdyosu</title>
    <style>
        /* --- Google Fonts --- */
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #0b0f19 !important; /* Lüks Gece Mavisi Arka Plan */
            color: #ffffff !important;
            padding: 0 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- Üst Menü (Navbar) --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 50px;
        }

        .logo-svg {
            height: 56px; /* Büyütülmüş Marka Logosu */
            width: auto;
            display: block;
        }

        .right-nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-menu {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-menu a {
            text-decoration: none;
            color: #94a3b8 !important;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-menu a:hover {
            color: #ffffff !important;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff !important;
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .lang-btn:hover {
            background: #ffffff !important;
            color: #0b0f19 !important;
        }

        /* --- Tanıtım Alanı (Hero) --- */
        .hero {
            text-align: center;
            padding: 40px 0 60px 0;
            max-width: 800px;
            margin: 0 auto;
        }

        .studio-badge {
            background: rgba(122, 75, 255, 0.15);
            border: 1px solid rgba(122, 75, 255, 0.4);
            color: #c084fc !important;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 25px;
            letter-spacing: -1.5px;
            color: #ffffff !important;
        }

        h1 span {
            background: linear-gradient(135deg, #7a4bff 0%, #ff5e62 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .hero p {
            font-size: 1.25rem;
            color: #cbd5e1 !important;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .hero-soon {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #7a4bff 0%, #ff5e62 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* --- Uygulama Kartları Listesi --- */
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
            color: #ffffff !important;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
            width: 100%;
            margin-bottom: 80px;
        }

        .card {
            background: #111827;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(122, 75, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .app-icon {
            font-size: 2.2rem;
            background: rgba(255,255,255,0.03);
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .badge {
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge.active { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge.soon { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }

        .card h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff !important;
        }

        .card p {
            color: #94a3b8 !important;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .card-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .btn-primary { background: #ffffff; color: #0b0f19; }
        .card:hover .btn-primary { background: #7a4bff; color: #ffffff; }

        .btn-secondary {
            background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        /* --- Hakkımızda --- */
        .about-section {
            background: rgba(255,255,255,0.01);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 50px;
            margin-bottom: 80px;
        }

        .about-section p {
            color: #94a3b8 !important;
            font-size: 1.15rem;
            line-height: 1.8;
        }

        /* --- Footer --- */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 0;
            text-align: center;
            color: #94a3b8 !important;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            nav { flex-direction: column; gap: 20px; }
            .right-nav { flex-direction: column; gap: 20px; width: 100%; }
            .nav-menu { justify-content: center; width: 100%; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Navbar -->
        <nav>
            <div class="logo-container" onclick="window.scrollTo(0,0)">
                <svg class="logo-svg" viewBox="0 0 520 130" xmlns="http://w3.org">
                    <g transform="translate(10, 10)">
                        <rect x="25" y="5" width="42" height="42" rx="14" fill="#7A4BFF" transform="rotate(-12 46 26)"/>
                        <rect x="75" y="15" width="42" height="42" rx="14" fill="#FF5E62" transform="rotate(15 96 36)"/>
                        <rect x="15" y="58" width="42" height="42" rx="14" fill="#2BB7A4" transform="rotate(10 36 79)"/>
                        <rect x="65" y="62" width="42" height="42" rx="14" fill="#FFC845" transform="rotate(-8 86 83)"/>
                    </g>
                    <text x="155" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">AppMall</text>
                </svg>
            </div>
            <div class="right-nav">
                <ul class="nav-menu">
                    <li><a href="#" id="menuHome">Ana Sayfa</a></li>
                    <li><a href="#apps" id="menuApps">Uygulamalar</a></li>
                    <li><a href="#about" id="menuAbout">Hakkımızda</a></li>
                    <li><a href="mailto:support@appmall.io" id="menuSupport">Destek</a></li>
                </ul>
                <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
            </div>
        </nav>

        <!-- Giriş Ekranı ve Başlıklar -->
        <header class="hero">
            <div class="studio-badge" id="heroBadge">Uygulama Geliştirme Stüdyosu</div>
            <h1 id="mainTitle">Mikro Çözümlerle<br>Geleceği <span>Şekillendiriyoruz</span></h1>
            <p id="mainDesc">AppMall çatısı altında; günlük hayatın karmaşasını çözen, hız, estetik ve minimalizmi odağına alan yeni nesil mobil öncelikli ürünler üretiyoruz.</p>
            <div class="hero-soon" id="heroSoonText">Çok Yakında</div>
        </header>

        <!-- Portföy Kartları -->
