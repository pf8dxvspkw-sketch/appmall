<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppMall | Minimalist Web Apps</title>
    <style>
        :root {
            --bg: #f8fafc;
            --text: #0f172a;
            --primary: #3b82f6;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .lang-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .lang-btn:hover {
            background: #f1f5f9;
        }
        header {
            text-align: center;
            margin: 20px 0 40px 0;
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }
        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
            border: 1px solid var(--border);
        }
        .card:hover { transform: translateY(-4px); }
        .badge {
            background: #dbeafe;
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav>
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
    </nav>

    <header>
        <h1 id="mainTitle">AppMall</h1>
        <p id="mainDesc">Sade, hızlı ve hayatı kolaylaştıran mobil öncelikli uygulamalar çatısı.</p>
    </header>

    <main class="grid">
        <!-- Give Up Smoking -->
        <a href="apps/give-up-smoking.html" class="card">
            <span class="badge" id="appBadge">Sağlık & Yaşam</span>
            <h2 id="appTitle">Give Up Smoking</h2>
            <p id="appDesc">Sigarayı bırakma sürecinizi takip edin, sağlığınızı ve bütçenizi geri kazanın.</p>
        </a>
    </main>

    <script>
        // Dil içerikleri veri sözlüğü
        const translations = {
            tr: {
                btn: "EN",
                desc: "Sade, hızlı ve hayatı kolaylaştıran mobil öncelikli uygulamalar çatısı.",
                badge: "Sağlık & Yaşam",
                appDesc: "Sigarayı bırakma sürecinizi takip edin, sağlığınızı ve bütçenizi geri kazanın."
            },
            en: {
                btn: "TR",
                desc: "Simple, fast, and mobile-first web applications hub.",
                badge: "Health & Life",
                appDesc: "Track your smoking cessation process, regain your health and budget."
            }
        };

        let currentLang = 'tr';

        function toggleLanguage() {
            currentLang = currentLang === 'tr' ? 'en' : 'tr';
            
            // DOM elemanlarını güncelleme
            document.getElementById('langBtn').innerText = translations[currentLang].btn;
            document.getElementById('mainDesc').innerText = translations[currentLang].desc;
            document.getElementById('appBadge').innerText = translations[currentLang].badge;
            document.getElementById('appDesc').innerText = translations[currentLang].appDesc;
            
            // HTML etiket dilini güncelleme
            document.documentElement.lang = currentLang;
        }
    </script>
</body>
</html>
